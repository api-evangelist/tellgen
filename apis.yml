name: Tellgen
description: >-
  Shanghai Tellgen Life Sciences Co., Ltd. (Tellgen Corporation) is a Chinese in
  vitro diagnostics (IVD) company founded in 2003 and headquartered in Shanghai,
  focused on the research, development, manufacture, and distribution of high-end
  diagnostic reagents and instruments. Its portfolio spans tumor markers, HPV
  detection, autoimmune antibodies, infectious disease, thrombosis and
  reproductive-health assays across flow-fluorescence, chemiluminescence,
  real-time PCR / molecular, and clinical-chemistry platforms (TESMI analyzer
  family). The company was listed on the Shenzhen Stock Exchange ChiNext board in
  April 2017 (ticker 300642) and counts Qiming Venture Partners among its early
  investors. Tellgen is a medical-device and laboratory-reagent manufacturer and
  publishes no public developer API, SDK, or developer portal.
